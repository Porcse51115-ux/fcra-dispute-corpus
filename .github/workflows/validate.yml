name: Validate corpus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate corpus structure and vocabulary
        run: python scripts/validate.py corpus/

      - name: Print corpus statistics
        run: python scripts/stats.py
